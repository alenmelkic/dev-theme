---
deployment:
  tasks:
    - export DEPLOYPATH=/home/username/public_html/
    - /bin/rm -rf wp-content/themes/*/node_modules
    - /bin/rm -rf wp-content/themes/*/.git
    - /bin/rm -rf wp-content/themes/*/.github
    - /bin/rm -rf wp-content/themes/*/.gitignore
    - /bin/rm -rf wp-content/themes/*/.claude
    - /bin/rm -rf wp-content/themes/*/package.json
    - /bin/rm -rf wp-content/themes/*/package-lock.json
    - /bin/rm -rf wp-content/themes/*/composer.json
    - /bin/rm -rf wp-content/themes/*/composer.lock
    - /bin/rm -rf wp-content/themes/*/README.md
    - /bin/rm -rf wp-content/themes/*/.env
    - /bin/rm -rf wp-content/themes/*/.DS_Store
    - /bin/cp -R wp-content $DEPLOYPATH
